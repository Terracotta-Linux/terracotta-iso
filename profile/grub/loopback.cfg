# https://www.supergrubdisk.org/wiki/Loopback.cfg

# Search for the ISO volume
search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

# Get a human readable platform identifier
if [ "${grub_platform}" == 'efi' ]; then
    archiso_platform='UEFI'
elif [ "${grub_platform}" == 'pc' ]; then
    archiso_platform='BIOS'
else
    archiso_platform="${grub_cpu}-${grub_platform}"
fi

# Set default menu entry
default=terracotta
timeout=5
timeout_style=menu


# Menu entries
#
# Intentionally a single live/install entry, mirroring profile/grub/grub.cfg.
# %INSTALL_DIR% and %ARCHISO_LABEL% are archiso template variables
# substituted by mkarchiso at build time; they are left literal here.

menuentry "Terracotta Linux (%ARCH%, ${archiso_platform})" --class terracotta --class gnu-linux --class gnu --class os --id 'terracotta' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}" quiet splash
    initrd /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
}
