# Terracotta Linux Plymouth configuration.
#
# NOTE: This only selects the theme name. The actual theme files (scripts,
# images) are NOT part of this archiso profile — they are installed into the
# live environment by the terracotta-branding-plymouth package, which is
# listed in packages.x86_64. If that package does not ship a theme named
# "terracotta" under /usr/share/plymouth/themes/terracotta, Plymouth will
# fall back to the default theme at boot.
[Daemon]
Theme=terracotta
